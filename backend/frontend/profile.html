<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тралалео Тралала — профиль</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <section id="profileScreen" class="screen">
        <div class="profile-box">
            <h1>Профиль</h1>

            <div class="avatar-container">
                <img src="IMAGUS/SUPERPUPER_AVATARKA.jpg" alt="аватар гостика" class="avatar-img">
            </div>

            <p>
                Логин:
                <span id="profileUsername">Гость</span>
            </p>

            <button id="backToMessengerButton" type="button">
                Назад к чатам
            </button>

            <button id="logoutButton" type="button">
                Выйти
            </button>

            <p id="profileMessage"></p>
        </div>
    </section>

    <script src="profile.js"></script>
</body>

</html>
