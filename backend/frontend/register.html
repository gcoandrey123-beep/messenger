<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тралалео Тралала — регистрация</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <section id="registerScreen" class="screen">
        <div class="register-box">
            <h1>Регистрация</h1>

            <form id="registerForm">
                <label for="registerUsername">Логин</label>
                <input type="text" id="registerUsername" placeholder="Придумай">

                <label for="registerPassword">Пароль</label>
                <input type="password" id="registerPassword" placeholder="Придумай">

                <label for="registerPasswordRepeat">Подтвердите пароль</label>
                <input type="password" id="registerPasswordRepeat" placeholder="Придумай">

                <label for="phoneNumber">Номер телефона</label>
                <div class="phone-field">
                    <input type="tel" id="phoneNumber" placeholder="Номер телефона из госуслуг">
                    <button type="button" id="getCodeButton">接收簡訊</button>
                </div>

                <div id="CodeBlock" class="hidden">
                    <p>Код предет в течение <span id="timerText">2:00</span> </p>
                    <input type="text" placeholder="Сюда надо ввести смс">
                </div>

                <button type="submit">Продолжить</button>
            </form>

            <p>
                Уже есть аккаунт?
                <button type="button" id="openLoginButton">Войти</button>
            </p>

            <p id="registerMessage"></p>
        </div>
    </section>

    <script src="register.js"></script>
</body>

</html>
