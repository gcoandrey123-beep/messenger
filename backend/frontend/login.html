<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тралалео Тралала — вход</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <section id="loginScreen" class="screen">
        <div class="login-box">
            <h1>Вход</h1>

            <form id="loginForm">
                <label for="loginUsername">Логин</label>
                <input type="text" id="loginUsername" placeholder="Вспомни">

                <label for="loginPassword">Пароль</label>
                <input type="password" id="loginPassword" placeholder="Вспомни">

                <button type="submit">Продолжить</button>
            </form>

            <p>
                Хочешь еще аккаунт?
                <button type="button" id="openRegisterButton">Нажми</button>
            </p>

            <p id="loginMessage"></p>
        </div>
    </section>

    <script src="login.js"></script>
</body>
</html>
