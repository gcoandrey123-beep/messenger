<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тралалео Тралала — профиль</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <section id="profileScreen" class="screen">
        <div class="profile-box">
            <h1>Профиль</h1>

            <p>
                Логин:
                <span id="profileUsername">Гость</span>
            </p>

            <label for="inviteLink">Ваша ссылка для создания чата</label>
            <input id="inviteLink" type="text" readonly>

            <button id="copyInviteButton" type="button">
                Скопировать ссылку
            </button>

            <button id="backToMessengerButton" type="button">
                Назад к чатам
            </button>

            <button id="logoutButton" type="button">
                Выйти
            </button>

            <p id="profileMessage"></p>
        </div>
    </section>

    <script src="profile.js"></script>
</body>
</html>
